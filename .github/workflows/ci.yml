name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up npm
        run: npm install --global npm@10.9.4

      - name: Install dependencies
        run: npm ci

      - name: Run JavaScript tests
        run: npm test -- --runInBand

      - name: Lint JavaScript
        run: npm run lint:js -- --no-cache assets/src/admin

      - name: Lint CSS
        run: npm run lint:css -- assets/src/admin/style.css

      - name: Build production assets
        run: npm run build

  php:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.0"
            wordpress: "6.6"
          - php: "8.1"
            wordpress: latest
          - php: "8.2"
            wordpress: latest
          - php: "8.3"
            wordpress: latest
          - php: "8.4"
            wordpress: latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer:v2
        env:
          fail-fast: true

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check PHP syntax
        run: find . -path ./vendor -prune -o -path ./node_modules -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check PHP 8.0+ compatibility
        if: matrix.php == '8.4'
        run: composer phpcompat

      - name: Install WordPress test environment
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:${{ job.services.mysql.ports[3306] }} ${{ matrix.wordpress }} true

      - name: Run PHPUnit
        run: composer test

      - name: Enforce WordPress coding standards
        if: matrix.php == '8.4'
        run: composer phpcs
